[project]
name = "binance-ai-trader-api"
version = "0.1.0"
description = "Local control-plane API scaffold for Binance AI Trader"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "websockets>=16,<17",
]

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7.0",
  "httpx>=0.28,<1.0",
  "mypy>=1.13,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app --cov-report=term-missing -m 'not live_public'"
markers = [
  "live_public: performs a credential-free public Binance smoke test",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
warn_unreachable = true
no_implicit_reexport = true
