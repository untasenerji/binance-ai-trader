name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uta
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install backend dependencies
        run: uv sync --directory backend --group dev --locked
      - name: Check backend formatting
        run: uv run --directory backend --locked ruff format --check .
      - name: Lint backend
        run: uv run --directory backend --locked ruff check .
      - name: Type-check backend
        run: uv run --directory backend --locked mypy
      - name: Install Gitleaks CLI for backend secret-scan contract
        run: |
          readonly GITLEAKS_VERSION="8.30.0"
          readonly GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          readonly GITLEAKS_SHA256="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          readonly GITLEAKS_DIRECTORY="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${GITLEAKS_DIRECTORY}"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
            --output "${GITLEAKS_DIRECTORY}/${GITLEAKS_ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_DIRECTORY}/${GITLEAKS_ARCHIVE}" | sha256sum --check --status
          tar --extract --gzip --file "${GITLEAKS_DIRECTORY}/${GITLEAKS_ARCHIVE}" --directory "${GITLEAKS_DIRECTORY}"
          echo "${GITLEAKS_DIRECTORY}" >> "${GITHUB_PATH}"
          "${GITLEAKS_DIRECTORY}/gitleaks" version
      - name: Test backend, including PostgreSQL acceptance coverage
        run: |
          mkdir -p backend/test-results
          uv run --directory backend --locked pytest -m "not live_public" --cov-fail-under=80 --junitxml=test-results/junit.xml --cov-report=xml:coverage.xml --cov-report=json:coverage.json
      - name: Enforce true branch coverage
        run: >-
          uv run --directory backend --locked python scripts/verify_branch_coverage.py
          --coverage-json coverage.json --minimum 65
          --module app/planning/fills.py=70
          --module app/simulation/intent_ledger.py=70
          --module app/simulation/simulator.py=70
          --module app/persistence/circuit_breaker.py=70
          --module app/persistence/recovery_service.py=70
          --module app/exchange/contracts.py=70
          --module app/observability/logging.py=70
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-evidence
          path: |
            backend/test-results/junit.xml
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Test frontend
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser checks
        run: npm run test:e2e
        working-directory: frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
