name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uta
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        run: uv sync --directory backend --group dev --locked
      - name: Check backend formatting
        run: uv run --directory backend --locked ruff format --check .
      - name: Lint backend
        run: uv run --directory backend --locked ruff check .
      - name: Type-check backend
        run: uv run --directory backend --locked mypy
      - name: Test backend, including PostgreSQL acceptance coverage
        run: |
          mkdir -p backend/test-results
          uv run --directory backend --locked pytest -m "not live_public" --cov-fail-under=80 --junitxml=test-results/junit.xml --cov-report=xml:coverage.xml
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: |
            backend/test-results/junit.xml
            backend/coverage.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Test frontend
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser checks
        run: npm run test:e2e
        working-directory: frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
